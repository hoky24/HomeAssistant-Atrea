rules:
  # Bronze
  action-setup:
    status: exempt
    comment: The integration registers no custom service actions.
  appropriate-polling: done
  brands:
    status: exempt
    comment: >-
      HACS fork; not registered in the core home-assistant/brands repo.
  common-modules: done
  config-flow: done
  config-flow-test-coverage: done
  dependency-transparency: done
  docs-actions:
    status: exempt
    comment: No custom actions to document.
  docs-high-level-description: done
  docs-installation-instructions: done
  docs-removal-instructions: done
  entity-event-setup: done
  entity-unique-id: done
  has-entity-name: done
  runtime-data: done
  test-before-configure: done
  test-before-setup: done
  unique-config-entry: done

  # Silver
  action-exceptions: done
  config-entry-unloading: done
  docs-configuration-parameters: done
  docs-installation-parameters: done
  entity-unavailable: done
  integration-owner: done
  log-when-unavailable: done
  parallel-updates: done
  reauthentication-flow: done
  test-coverage: done

  # Gold
  devices: done
  diagnostics: done
  discovery:
    status: exempt
    comment: >-
      Atrea RD5 units expose no zeroconf/mDNS/SSDP service and present no
      reliable DHCP OUI to match against; setup is by manual IP entry only.
  discovery-update-info:
    status: exempt
    comment: >-
      No network discovery protocol exists for these units, so there is no
      discovery payload from which to update connection info.
  docs-data-update: done
  docs-examples: done
  docs-known-limitations: done
  docs-supported-devices: done
  docs-supported-functions: done
  docs-troubleshooting: done
  docs-use-cases: done
  dynamic-devices:
    status: exempt
    comment: >-
      One device per config entry; the integration is not a hub and never
      adds or removes sub-devices at runtime.
  entity-category:
    status: exempt
    comment: >-
      Only primary entities are created (climate, update); there are no
      noisy/diagnostic or configuration entities to categorize.
  entity-device-class: done
  entity-disabled-by-default:
    status: exempt
    comment: >-
      Only primary entities are created (climate, update); there are no
      noisy or rarely-useful entities to disable by default.
  entity-translations:
    status: exempt
    comment: >-
      The climate entity is the device's primary feature, so its name comes
      from the device (has_entity_name). Preset/program values are
      device-defined free strings and cannot use the standard
      state-translation mechanism. The update entity's name IS translated
      (translation_key=firmware).
  exception-translations: done
  icon-translations: done
  reconfiguration-flow: done
  repair-issues: done
  stale-devices:
    status: exempt
    comment: >-
      One device per config entry; the device is removed together with the
      entry. No hub managing a fluctuating device set.

  # Platinum
  async-dependency: done
  inject-websession: done
  strict-typing: done
