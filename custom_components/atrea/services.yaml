apply:
  target:
    entity:
      integration: atrea
    device:
      integration: atrea
  fields:
    program:
      example: manual
      selector:
        select:
          options:
            - manual
            - schedule
            - temporary
    mode:
      example: Ventilation
      selector:
        text:
    power:
      example: 80
      selector:
        number:
          min: 12
          max: 100
          step: 1
          unit_of_measurement: "%"
          mode: box
    target_temperature:
      example: 22
      selector:
        number:
          min: 10
          max: 40
          step: 0.5
          unit_of_measurement: "°C"
          mode: box
